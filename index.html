  <meta property="og:title" content="2026 국민기초생활수급자 · 차상위본인부담경감 통합 모의계산기" />
  <meta property="og:description" content="보건복지부 2026년 국민기초생활보장 및 차상위 본인부담경감대상자 지침 기반 소득인정액·부양의무자·질환코드(C/E/F) 통합 모의계산기" />

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #334155;
      --text-muted: #475569;
      --border-color: #cbd5e1;
      --border-light: #e2e8f0;
      --blue-50: #eff6ff;
      --blue-100: #dbeafe;
      --blue-200: #bfdbfe;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --blue-700: #1d4ed8;
      --blue-800: #1e40af;
      --blue-900: #1e3a8a;
      --teal-50: #f0fdfa;
      --teal-100: #ccfbf1;
      --teal-200: #99f6e4;
      --teal-500: #14b8a6;
      --teal-600: #0d9488;
      --teal-700: #0f766e;
      --teal-800: #115e59;
      --teal-900: #134e4a;
      --emerald-50: #ecfdf5;
      --emerald-100: #d1fae5;
      --emerald-200: #a7f3d0;
      --emerald-600: #059669;
      --emerald-700: #047857;
      --emerald-800: #065f46;
      --amber-50: #fffbeb;
      --amber-100: #fef3c7;
      --amber-200: #fde68a;
      --amber-600: #d97706;
      --amber-700: #b45309;
      --amber-800: #92400e;
      --rose-50: #fff1f2;
      --rose-100: #ffe4e6;
      --rose-200: #fecdd3;
      --rose-600: #e11d48;
      --rose-700: #be123c;
      --purple-50: #faf5ff;
      --purple-100: #f3e8ff;
      --purple-200: #e9d5ff;
      --purple-600: #9333ea;
      --purple-700: #7e22ce;
      --purple-800: #6b21a8;
      --indigo-50: #eef2ff;
      --indigo-100: #e0e7ff;
      --indigo-200: #c7d2fe;
      --indigo-600: #4f46e5;
      --indigo-700: #4338ca;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      font-size: 17.5px;
      font-family: var(--font-sans);
      line-height: 1.6;
      color: var(--text-main);
      background-color: var(--bg-page);
      -webkit-font-smoothing: antialiased;
    }
    body {
      word-break: keep-all;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    button, input, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }
    button { cursor: pointer; background: none; border: none; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .font-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Layout Containers */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    @media (min-width: 640px) { .container { padding: 0 1.5rem; } }
    @media (min-width: 1024px) { .container { padding: 0 2rem; } }

    /* Sticky Header */
    .site-header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .header-inner { padding: 0.55rem 0; }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 0;
    }
    .brand-icon {
      width: 2rem;
      height: 2rem;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, var(--blue-600), var(--indigo-700));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 900;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      white-space: nowrap;
    }
    .badge-guide {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.15rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      background: var(--teal-50);
      color: var(--teal-800);
      border: 1px solid var(--teal-200);
      white-space: nowrap;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .font-switcher {
      display: inline-flex;
      align-items: center;
      background: #f1f5f9;
      padding: 0.15rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border-light);
    }
    .font-switcher-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 0.4rem;
    }
    .font-btn {
      padding: 0.15rem 0.45rem;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 0.35rem;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .font-btn.active {
      background: #ffffff;
      color: var(--blue-700);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      border: 1px solid var(--border-light);
    }
    .btn-header {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 0.5rem;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-explainer {
      background: var(--blue-50);
      color: var(--blue-700);
      border: 1px solid var(--blue-200);
    }
    .btn-explainer:hover { background: var(--blue-100); }
    .btn-criteria {
      background: #f8fafc;
      color: var(--text-sub);
      border: 1px solid var(--border-color);
    }
    .btn-criteria:hover { background: #f1f5f9; }
    .btn-reset {
      background: var(--rose-50);
      color: var(--rose-700);
      border: 1px solid var(--rose-200);
    }
    .btn-reset:hover { background: var(--rose-100); }
    .btn-print {
      background: var(--blue-600);
      color: #ffffff;
      border: 1px solid var(--blue-600);
    }
    .btn-print:hover { background: var(--blue-700); }
    .btn-download {
      background: var(--teal-600);
      color: #ffffff;
      border: 1px solid var(--teal-600);
    }
    .btn-download:hover { background: var(--teal-700); }

    /* Preset Bar */
    .preset-bar {
      margin-top: 0.4rem;
      padding-top: 0.4rem;
      border-top: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      overflow-x: auto;
      font-size: 0.74rem;
    }
    .preset-label {
      color: var(--text-muted);
      font-weight: 700;
      flex-shrink: 0;
      margin-right: 0.15rem;
    }
    .preset-btn {
      padding: 0.2rem 0.55rem;
      border-radius: 0.375rem;
      background: #f1f5f9;
      color: var(--text-sub);
      font-weight: 600;
      border: 1px solid var(--border-light);
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .preset-btn:hover {
      background: var(--blue-50);
      color: var(--blue-700);
      border-color: var(--blue-200);
    }
    .preset-btn.special {
      background: var(--teal-50);
      color: var(--teal-800);
      border-color: var(--teal-200);
      font-weight: 700;
    }
    .preset-btn.special:hover { background: var(--teal-100); }

    /* Main Content & Cards */
    .main-content {
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .section-card {
      background: var(--bg-card);
      border-radius: 0.85rem;
      border: 1px solid var(--border-light);
      padding: 1.35rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
      position: relative;
    }
    @media (min-width: 640px) { .section-card { padding: 1.6rem; } }
    .section-card.near-poverty-card {
      border-color: var(--teal-200);
      overflow: hidden;
    }
    .near-poverty-top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--teal-500), var(--emerald-600), #06b6d4);
    }
    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-bottom: 0.9rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid #f1f5f9;
    }
    .section-title-group, .section-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .step-badge {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.55rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      flex-shrink: 0;
      background: var(--blue-50);
      color: var(--blue-600);
    }
    .step-badge-teal {
      background: var(--teal-600);
      color: #ffffff;
    }
    .step-1 { background: var(--blue-50); color: var(--blue-600); }
    .step-2 { background: var(--emerald-50); color: var(--emerald-600); }
    .step-3 { background: var(--indigo-50); color: var(--indigo-600); }
    .step-4 { background: var(--teal-50); color: var(--teal-600); }
    .step-5 { background: var(--teal-600); color: #ffffff; }
    .step-6 { background: var(--blue-600); color: #ffffff; }

    .section-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .section-desc, .section-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    /* Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }
    @media (min-width: 768px) { .grid-2 { grid-template-columns: repeat(2, 1fr); } }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 768px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }

    .grid-4 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.9rem;
    }
    @media (min-width: 640px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }

    .grid-7 {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.45rem;
    }

    /* Sub-panels & Sub-boxes */
    .sub-panel, .sub-box {
      padding: 1.05rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border-light);
      background: #f8fafc;
    }
    .sub-box-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.65rem;
      display: block;
    }
    .sub-panel-blue { background: rgba(239, 246, 255, 0.35); border-color: var(--blue-200); }
    .sub-panel-amber { background: rgba(255, 251, 235, 0.45); border-color: var(--amber-200); }
    .sub-panel-rose { background: rgba(255, 241, 242, 0.35); border-color: var(--rose-200); }
    .sub-panel-teal { background: rgba(240, 253, 250, 0.45); border-color: var(--teal-200); }
    .sub-panel-purple { background: rgba(250, 245, 255, 0.65); border-color: var(--purple-200); }

    .sub-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .sub-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .sub-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
      line-height: 1.5;
    }

    /* Member Selector & Region Selector */
    .member-btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.45rem;
    }
    @media (min-width: 640px) { .member-btn-grid { grid-template-columns: repeat(7, 1fr); } }
    .member-btn {
      padding: 0.55rem 0.4rem;
      text-align: center;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1px solid var(--border-light);
      background: #ffffff;
      color: var(--text-sub);
      transition: all 0.15s;
    }
    .member-btn:hover { background: #f8fafc; }
    .member-btn.active {
      background: var(--blue-600);
      color: #ffffff;
      border-color: var(--blue-600);
      box-shadow: 0 1px 2px rgba(37, 99, 235, 0.25);
    }
    .region-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.6rem;
    }
    @media (min-width: 640px) { .region-grid { grid-template-columns: repeat(2, 1fr); } }
    .region-card {
      padding: 0.75rem;
      text-align: left;
      border-radius: 0.6rem;
      border: 1px solid var(--border-light);
      background: #ffffff;
      transition: all 0.15s;
    }
    .region-card:hover { background: #f8fafc; }
    .region-card.active {
      background: var(--blue-50);
      border-color: var(--blue-500);
      box-shadow: 0 0 0 2px var(--blue-100);
    }

    /* Currency Input Component */
    .currency-field { width: 100%; }
    .currency-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .currency-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .currency-korean-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--blue-700);
      background: var(--blue-50);
      border: 1px solid var(--blue-200);
      padding: 0.1rem 0.45rem;
      border-radius: 0.35rem;
      flex-shrink: 0;
    }
    .currency-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .currency-input {
      width: 100%;
      border-radius: 0.5rem;
      border: 1px solid var(--border-color);
      background: #ffffff;
      padding: 0.55rem 2.4rem 0.55rem 0.8rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .currency-input:focus {
      outline: none;
      border-color: var(--blue-500);
      box-shadow: 0 0 0 3px var(--blue-100);
    }
    .currency-unit {
      position: absolute;
      right: 0.8rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      pointer-events: none;
    }
    .currency-helper {
      margin-top: 0.3rem;
      font-size: 0.76rem;
      color: var(--text-muted);
      line-height: 1.45;
    }
    .quick-btn-row {
      margin-top: 0.4rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem;
    }
    .quick-btn {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      background: #f1f5f9;
      color: var(--text-sub);
      border-radius: 0.35rem;
      border: 1px solid var(--border-light);
    }
    .quick-btn:hover { background: #e2e8f0; }
    .quick-btn-clear {
      margin-left: auto;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.45rem;
      color: var(--rose-600);
    }
    .quick-btn-clear:hover { text-decoration: underline; }

    /* Form Controls */
    .text-input, .select-input {
      border-radius: 0.5rem;
      border: 1px solid var(--border-color);
      background: #ffffff;
      padding: 0.4rem 0.65rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }
    .text-input:focus, .select-input:focus {
      outline: none;
      border-color: var(--blue-500);
    }

    /* Radio & Option Cards */
    .option-card {
      display: block;
      padding: 0.75rem;
      border-radius: 0.55rem;
      border: 1px solid var(--border-light);
      background: #ffffff;
      cursor: pointer;
      transition: all 0.15s;
    }
    .option-card:hover { background: #f8fafc; }
    .option-card.selected-blue {
      background: var(--blue-50);
      border-color: var(--blue-500);
      box-shadow: 0 0 0 2px var(--blue-100);
    }
    .option-card.selected-teal {
      background: var(--teal-50);
      border-color: var(--teal-500);
      box-shadow: 0 0 0 2px var(--teal-100);
    }
    .option-card.selected-rose {
      background: var(--rose-50);
      border-color: var(--rose-600);
    }

    /* Badges */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.15rem 0.55rem;
      border-radius: 0.375rem;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .pill-blue { background: var(--blue-100); color: var(--blue-800); }
    .pill-teal { background: var(--teal-100); color: var(--teal-800); }
    .pill-emerald { background: var(--emerald-100); color: var(--emerald-800); }
    .pill-amber { background: var(--amber-100); color: var(--amber-800); }
    .pill-rose { background: var(--rose-100); color: var(--rose-700); }
    .pill-purple { background: var(--purple-100); color: var(--purple-800); }
    .pill-slate { background: #f1f5f9; color: var(--text-muted); }

    /* Progress Bar */
    .progress-track-wrap {
      position: relative;
      margin-top: 2.2rem;
      margin-bottom: 2.8rem;
      padding-top: 0.4rem;
    }
    .progress-track {
      height: 1.1rem;
      width: 100%;
      background: #e2e8f0;
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.35s ease;
      background: linear-gradient(90deg, var(--blue-500), var(--indigo-600), var(--emerald-600));
    }
    .progress-marker {
      position: absolute;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      top: 0.4rem;
    }
    .progress-pin {
      position: absolute;
      top: -1.9rem;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      transition: left 0.35s ease;
    }

    /* Tables */
    .data-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border-light);
      border-radius: 0.6rem;
      background: #ffffff;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: left;
    }
    .data-table th, .data-table td {
      padding: 0.6rem 0.7rem;
      border-bottom: 1px solid var(--border-light);
      border-right: 1px solid var(--border-light);
    }
    .data-table th:last-child, .data-table td:last-child { border-right: none; }
    .data-table thead th {
      background: #f8fafc;
      font-weight: 800;
      color: var(--text-sub);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.55);

    function formatNum(num) {

    function formatKoreanWon(amount) {
      if (!amount || amount === 0) return '0원';
      const isNegative = amount < 0;
      const abs = Math.round(Math.abs(amount));
      const eok = Math.floor(abs / 100000000);
      const man = Math.floor((abs % 100000000) / 10000);
      const won = abs % 10000;
      const parts = [];
      if (eok > 0) parts.push(eok.toLocaleString('ko-KR') + '억');
      if (man > 0) parts.push(man.toLocaleString('ko-KR') + '만');
      if (won > 0 || parts.length === 0) parts.push(won.toLocaleString('ko-KR'));
      return (isNegative ? '-' : '') + parts.join(' ') + '원';
    }

    function escHtml(str) {

    function calculateMedianIncome(householdSize, criteriaConfig) {
      const size = Math.max(1, Math.floor(householdSize || 1));
      if (criteriaConfig) {
        if (size <= 7 && criteriaConfig.medianIncome[size] !== undefined) {
          return criteriaConfig.medianIncome[size];
        }
        const base7 = criteriaConfig.medianIncome[7] ?? DEFAULT_2026_MEDIAN_INCOME[7];
        return base7 + (size - 7) * criteriaConfig.extraPersonIncrement;
      }
      if (size <= 7) return DEFAULT_2026_MEDIAN_INCOME[size];
      return DEFAULT_2026_MEDIAN_INCOME[7] + (size - 7) * EXTRA_PERSON_INCREMENT_2026;
    }

    function getBenefitCriterionAmount(type, householdSize, criteriaConfig) {
      const size = Math.max(1, Math.floor(householdSize || 1));
      const ratio = BENEFIT_RATIOS[type];
      if (criteriaConfig) {
        if (size <= 7 && criteriaConfig[type][size] !== undefined) {
          return criteriaConfig[type][size];
        }
        const base7 = criteriaConfig[type][7] ?? Math.round(DEFAULT_2026_MEDIAN_INCOME[7] * ratio);
        const increment = Math.round(criteriaConfig.extraPersonIncrement * ratio);
        return base7 + (size - 7) * increment;
      }
      return Math.round(calculateMedianIncome(size) * ratio);
    }

    function calculateNearPovertyMedian50(householdSize) {
      const size = Math.max(1, Math.floor(householdSize || 1));
      if (size <= 7) return NEAR_POVERTY_2026_MEDIAN_50[size];
      return NEAR_POVERTY_2026_MEDIAN_50[7] + (size - 7) * NEAR_POVERTY_EXTRA_INCREMENT_50;
    }

    function getNearPovertyObligationCriterion(targetCount, effectiveFamilyCount) {
      const t = Math.min(Math.max(1, Math.floor(targetCount || 1)), 7);
      const f = Math.max(1, Math.floor(effectiveFamilyCount || 1));
      const row = NEAR_POVERTY_OBLIGATION_TABLE_2026[t];
      if (f <= 7) return row[f];
      const increment = row[7] - row[6];
      return row[7] + (f - 7) * increment;
    }

    function calculateEarnedIncomeDeduction(member) {
      const totalGross = Math.max(0, (member.earnedIncome || 0) + (member.businessIncome || 0));
      if (totalGross === 0) {
        return { totalGross: 0, fixedDeduction: 0, rateDeduction: 0, totalDeduction: 0, netIncome: 0, formulaText: '소득 없음' };
      }
      let fixed = 0, rate = 0.30, label = '';
      switch (member.category) {
        case 'youth':
          fixed = 600000; rate = 0.30; label = '청년·대학생 (60만원 + 잔액 30% 공제)'; break;
        case 'elderly_75':
          fixed = 200000; rate = 0.30; label = '75세 이상 노인 (20만원 + 잔액 30% 공제)'; break;
        case 'elderly_65_74':
          fixed = 0; rate = 0.30; label = '65~74세 노인 (30% 공제)'; break;
        case 'disabled':
          fixed = 0; rate = 0.30; label = '등록장애인 (30% 공제, 직업재활 등 해당시 별도)'; break;
        case 'north_korean':
          fixed = 0; rate = 0.30; label = '북한이탈주민 (30% 공제)'; break;
        case 'vocational_high':
          fixed = 0; rate = 0.50; label = '자활·취업성공 (50% 공제)'; break;
        case 'vocational_low':
          fixed = 0; rate = 0.30; label = '기타 자활근로 (30% 공제)'; break;
        case 'student':
          fixed = 200000; rate = 0.30; label = '초·중·고교생 (20만원 + 잔액 30% 공제)'; break;
        default:
          fixed = 0; rate = 0.30; label = '일반 근로·사업소득 (30% 공제)'; break;
      }
      const appliedFixed = Math.min(totalGross, fixed);
      const remaining = Math.max(0, totalGross - appliedFixed);
      const rateDeduction = Math.floor(remaining * rate);
      const totalDeduction = appliedFixed + rateDeduction;
      const netIncome = Math.max(0, totalGross - totalDeduction);
      return { totalGross, fixedDeduction: appliedFixed, rateDeduction, totalDeduction, netIncome, formulaText: label };
    }

    function calculatePropertyConversion(inputs) {
      const regionConfig = REGION_CONFIGS.find(r => r.id === inputs.region) || REGION_CONFIGS[2];
      const basicPropertyDeduction = inputs.isSpecialHousehold ? regionConfig.basicDeductionSpecial : regionConfig.basicDeductionGeneral;
      const residentialLimit = regionConfig.residentialLimit;

      const rawResidential = Math.max(0,
        (inputs.residentialProperty.ownedHouseValue || 0) +
        (inputs.residentialProperty.jeonseDepositRatio95 || 0) +
        (inputs.residentialProperty.otherResidential || 0)
      );
      const recognizedResidential = Math.min(rawResidential, residentialLimit);
      const excessResidential = Math.max(0, rawResidential - residentialLimit);

      const rawGeneral = Math.max(0,
        (inputs.generalProperty.generalHouseValue || 0) +
        (inputs.generalProperty.buildingValue || 0) +
        (inputs.generalProperty.landValue || 0) +
        (inputs.generalProperty.otherGeneral || 0)

      const totalGeneralProperty = rawGeneral + excessResidential;

      const rawFinancial = Math.max(0,
        (inputs.financialProperty.savingsAndDeposits || 0) +
        (inputs.financialProperty.stocksAndFunds || 0) +
        (inputs.financialProperty.insuranceSurrenderValue || 0) +
        (inputs.financialProperty.otherFinancial || 0)
      );
      const financialLivingDeduction = rawFinancial > 0 ? Math.min(rawFinancial, 5000000) : 0;
      const netFinancialBeforePool = Math.max(0, rawFinancial - financialLivingDeduction);

      let generalCarValue = 0, fullConversionCarValue = 0;
      for (const car of (inputs.cars || [])) {
        const val = Math.max(0, car.value || 0);
        if (car.conversionType === 'exempt') continue;
        else if (car.conversionType === 'general') generalCarValue += val;
        else fullConversionCarValue += val;
      }
      const totalGeneralWithCar = totalGeneralProperty + generalCarValue;

      const totalDebt = Math.max(0,
        (inputs.debt.housingMortgage || 0) +
        (inputs.debt.creditAndGeneralLoan || 0) +
        (inputs.debt.depositReceived || 0) +
        (inputs.debt.otherDebt || 0)
      );

      let pool = basicPropertyDeduction + totalDebt;
      const deductRes = Math.min(recognizedResidential, pool);
      const netResidential = Math.max(0, recognizedResidential - deductRes);
      pool -= deductRes;

      const deductGen = Math.min(totalGeneralWithCar, pool);
      const netGeneral = Math.max(0, totalGeneralWithCar - deductGen);
      pool -= deductGen;

      const deductFin = Math.min(netFinancialBeforePool, pool);
      const netFinancial = Math.max(0, netFinancialBeforePool - deductFin);
      pool -= deductFin;

      const deductCar = Math.min(fullConversionCarValue, pool);
      const netCarFull = Math.max(0, fullConversionCarValue - deductCar);
      pool -= deductCar;

      const convertedResidentialIncome = Math.floor(netResidential * 0.0104);
      const convertedGeneralIncome = Math.floor(netGeneral * 0.0417);
      const convertedFinancialIncome = Math.floor(netFinancial * 0.0626);
      const convertedCarFullIncome = Math.floor(netCarFull * 1.0);
      const totalConvertedPropertyIncome = convertedResidentialIncome + convertedGeneralIncome + convertedFinancialIncome + convertedCarFullIncome;

      return {
        rawResidential, recognizedResidential, excessResidential, rawGeneral, totalGeneralProperty,
        rawFinancial, financialLivingDeduction, generalCarValue, fullConversionCarValue,
        basicPropertyDeduction, totalDebt, totalDeductionPool: basicPropertyDeduction + totalDebt,
        netResidential, netGeneral, netFinancial, netCarFull,
        convertedResidentialIncome, convertedGeneralIncome, convertedFinancialIncome, convertedCarFullIncome,
        totalConvertedPropertyIncome,
      };
    }

    function calculateNearPoverty(inputs, memberBreakdowns, propertyBreakdown, isBasicLivelihoodEligible, isBasicMedicalEligible) {
      const np = inputs.nearPoverty;
      const criterion50 = calculateNearPovertyMedian50(inputs.householdSize);
      const totalEarnedAndBusinessIncome = memberBreakdowns.reduce((s, m) => s + m.netIncome, 0);
      const totalPropertyIncome = Math.max(0,
        (inputs.propertyIncome.rentalIncome || 0) +
        (inputs.propertyIncome.interestIncome || 0) +
        (inputs.propertyIncome.otherPropertyIncome || 0)
      );
      const excludedPrivateTransferAmount = Math.max(0, inputs.transferIncome.privateTransfer || 0);
      const totalTransferIncomeAfterExclusion = Math.max(0,
        (inputs.transferIncome.publicPension || 0) +
        (inputs.transferIncome.basicPension || 0) +
        (inputs.transferIncome.otherTransfer || 0)
      );
      const totalExpenditureDeduction = Math.max(0,
        (inputs.expenditureDeduction.medicalExpense || 0) +
        (inputs.expenditureDeduction.rehabilitationExpense || 0) +
        (inputs.expenditureDeduction.pensionInsurance || 0) +
        (inputs.expenditureDeduction.otherDeduction || 0)
      );
      const rawTotalIncome = totalEarnedAndBusinessIncome + totalPropertyIncome + totalTransferIncomeAfterExclusion;
      const incomeEvaluation = Math.max(0, rawTotalIncome - totalExpenditureDeduction);

      const basicPropertyDeduction = NEAR_POVERTY_BASIC_PROPERTY_DEDUCTION[inputs.region] || 135000000;
      const totalDebt = propertyBreakdown.totalDebt;
      const totalDeductionPool = basicPropertyDeduction + totalDebt;
      let pool = totalDeductionPool;

      const deductRes = Math.min(propertyBreakdown.recognizedResidential, pool);
      const netResidential = Math.max(0, propertyBreakdown.recognizedResidential - deductRes);
      pool -= deductRes;

      const totalGeneralWithCar = propertyBreakdown.totalGeneralProperty + propertyBreakdown.generalCarValue;
      const deductGen = Math.min(totalGeneralWithCar, pool);
      const netGeneral = Math.max(0, totalGeneralWithCar - deductGen);
      pool -= deductGen;

      const netFinancialBeforePool = Math.max(0, propertyBreakdown.rawFinancial - propertyBreakdown.financialLivingDeduction);
      const deductFin = Math.min(netFinancialBeforePool, pool);
      const netFinancial = Math.max(0, netFinancialBeforePool - deductFin);
      pool -= deductFin;

      const deductCar = Math.min(propertyBreakdown.fullConversionCarValue, pool);
      const netCarFull = Math.max(0, propertyBreakdown.fullConversionCarValue - deductCar);
      pool -= deductCar;

      const convertedResidentialIncome = Math.floor(netResidential * 0.0104);
      const convertedGeneralIncome = Math.floor(netGeneral * 0.0417);
      const convertedFinancialIncome = Math.floor(netFinancial * 0.0626);
      const convertedCarFullIncome = Math.floor(netCarFull * 1.0);
      const totalConvertedPropertyIncome = convertedResidentialIncome + convertedGeneralIncome + convertedFinancialIncome + convertedCarFullIncome;

      const recognizedIncome = incomeEvaluation + totalConvertedPropertyIncome;
      const isIncomeEligible = recognizedIncome <= criterion50;
      const marginAmount = criterion50 - recognizedIncome;

      const effectiveFamilyCount = Math.max(1, (np.obligorFamilyCount || 1) + (np.obligorSevereDisabledCount || 0));
      const obligationCriterion = getNearPovertyObligationCriterion(np.targetHouseholdQualifiedCount, effectiveFamilyCount);
      const targetRatioPercent = Math.min(180, 120 + (Math.min(7, Math.max(1, np.targetHouseholdQualifiedCount)) - 1) * 10);

      const medicalDeduction = Math.max(0, np.obligorMedicalExpense || 0);
      let educationDeduction = 0;
      if (np.obligorEducationType === 'university') {
        educationDeduction = Math.max(0, np.obligorEducationActual || 0);
      } else if (np.obligorEducationType !== 'none') {
        const standard = OBLIGATION_EDUCATION_STANDARD[np.obligorEducationType] || 0;
        educationDeduction = Math.max(standard, np.obligorEducationActual || 0);
      }
      const rentSizeKey = Math.min(Math.max(1, np.obligorFamilyCount || 1), 7);
      const rentMaxLimit = OBLIGATION_RENT_LIMIT[np.obligorRentGrade]?.[rentSizeKey] ?? 0;
      const rentDeduction = Math.min(Math.max(0, np.obligorRentActual || 0), rentMaxLimit);

      const obligorNetActualIncome = Math.max(0, (np.obligorMonthlyIncome || 0) - medicalDeduction - educationDeduction - rentDeduction);
      const obligorFinalRecognizedIncome = obligorNetActualIncome + Math.max(0, np.obligorConvertedPropertyIncome || 0);

      let isObligationEligible = true;
      let obligationReason = '부양의무자 없음 또는 조사 면제';
      if (np.obligationCheckMode === 'Pass') {
        isObligationEligible = true;
        obligationReason = '부양의무자 기준 충족 (간편 판정: 부양능력 없음/미약)';
      } else if (np.obligationCheckMode === 'Fail') {
        isObligationEligible = false;
        obligationReason = '부양의무자 기준 미충족 (간편 판정: 부양능력 있음)';
      } else if (np.obligationCheckMode === 'detailed') {
        if (np.obligorHasHighAssetSkip) {
          isObligationEligible = true;
          obligationReason = '부양의무자 고재산에 따른 부양비 부과 보류 특례 적용 (적합)';
        } else if (obligorFinalRecognizedIncome <= obligationCriterion) {
          isObligationEligible = true;
          obligationReason = '부양의무자 소득인정액(' + formatNum(obligorFinalRecognizedIncome) + '원)이 판정기준(' + formatNum(obligationCriterion) + '원, ' + targetRatioPercent + '%) 이하로 적합';
        } else {
          isObligationEligible = false;
          obligationReason = '부양의무자 소득인정액(' + formatNum(obligorFinalRecognizedIncome) + '원)이 판정기준(' + formatNum(obligationCriterion) + '원, ' + targetRatioPercent + '%) 초과';
        }
      }

      const categoryType = (np.qualifiedCategory === 'rare_severe' || np.qualifiedCategory === 'child_under18') ? 'type1_rare_child' : 'type2_chronic';
      const isEligible = np.hasQualifiedMember && isIncomeEligible && isObligationEligible && !isBasicMedicalEligible;

      let statusLabel = '선정 가능', statusReason = '';
      if (isBasicMedicalEligible) {
        statusLabel = '기초 의료급여 우선';
        statusReason = '기초생활보장 의료급여 수급 요건을 충족하므로 의료급여가 우선 적용됩니다. (실제 의료급여가 부양의무자 기준 등으로 탈락 시 차상위본인부담경감으로 연계 신청 가능)';
      } else if (!np.hasQualifiedMember) {
        statusLabel = '질환/연령 요건 미해당';
        statusReason = '희귀·중증난치질환자, 중증질환자, 6개월 이상 만성질환자 또는 18세 미만 아동 요건에 해당해야 합니다.';
      } else if (!isIncomeEligible) {
        statusLabel = '소득인정액 초과';
        statusReason = '차상위 산정 소득인정액(' + formatNum(recognizedIncome) + '원)이 기준 중위소득 50%(' + formatNum(criterion50) + '원)를 ' + formatNum(Math.abs(marginAmount)) + '원 초과합니다.';
      } else if (!isObligationEligible) {
        statusLabel = '부양의무자 기준 초과';
        statusReason = obligationReason;
      } else {
        statusLabel = '차상위경감 선정 가능';
        statusReason = (!isBasicLivelihoodEligible || !isBasicMedicalEligible)
          ? '기초 의료급여는 미선정이나, 차상위 완화된 기본재산액 공제 및 사적이전소득 제외 기준 적용 시 기준 중위소득 50% 이하로 차상위본인부담경감 연계 신청이 가능합니다!'
          : '소득·재산 및 부양의무자 기준을 모두 충족하여 차상위본인부담경감 선정 가능합니다.';
      }

      return {
        criterion50, totalEarnedAndBusinessIncome, totalPropertyIncome, excludedPrivateTransferAmount,
        totalTransferIncomeAfterExclusion, totalExpenditureDeduction, incomeEvaluation,
        basicPropertyDeduction, totalDebt, totalDeductionPool,
        netResidential, netGeneral, netFinancial, netCarFull,
        convertedResidentialIncome, convertedGeneralIncome, convertedFinancialIncome, convertedCarFullIncome,
        totalConvertedPropertyIncome, recognizedIncome, isIncomeEligible, marginAmount,
        obligationDetail: {
          mode: np.obligationCheckMode, effectiveFamilyCount, targetRatioPercent,
          obligationCriterion, obligorGrossIncome: np.obligorMonthlyIncome,
          medicalDeduction, educationDeduction, rentDeduction, obligorNetActualIncome,
          obligorConvertedPropertyIncome: np.obligorConvertedPropertyIncome,
          obligorFinalRecognizedIncome, isObligationEligible, obligationReason,
        },
        hasQualifiedMember: np.hasQualifiedMember, qualifiedCategory: np.qualifiedCategory,
        categoryType, isEligible, isRecommendedLinkage: (!isBasicMedicalEligible && isEligible),
        statusLabel, statusReason,
      };
    }

    function calculateWelfare(inputs, criteriaConfig) {
      const medianIncome = calculateMedianIncome(inputs.householdSize, criteriaConfig);
      const memberBreakdowns = (inputs.incomeMembers || []).map(m => ({
        memberId: m.id, name: m.name, category: m.category,
        ...calculateEarnedIncomeDeduction(m),
      }));
      const totalEarnedAndBusinessIncome = memberBreakdowns.reduce((s, m) => s + m.netIncome, 0);
      const totalPropertyIncome = Math.max(0,
        (inputs.propertyIncome.rentalIncome || 0) +
        (inputs.propertyIncome.interestIncome || 0) +
        (inputs.propertyIncome.otherPropertyIncome || 0)
      );
      const totalTransferIncome = Math.max(0,
        (inputs.transferIncome.publicPension || 0) +
        (inputs.transferIncome.basicPension || 0) +
        (inputs.transferIncome.privateTransfer || 0) +
        (inputs.transferIncome.otherTransfer || 0)
      );
      const totalExpenditureDeduction = Math.max(0,
        (inputs.expenditureDeduction.medicalExpense || 0) +
        (inputs.expenditureDeduction.rehabilitationExpense || 0) +
        (inputs.expenditureDeduction.pensionInsurance || 0) +
        (inputs.expenditureDeduction.otherDeduction || 0)
      );
      const rawTotalIncome = totalEarnedAndBusinessIncome + totalPropertyIncome + totalTransferIncome;
      const incomeEvaluation = Math.max(0, rawTotalIncome - totalExpenditureDeduction);

      const propertyBreakdown = calculatePropertyConversion(inputs);
      const recognizedIncome = incomeEvaluation + propertyBreakdown.totalConvertedPropertyIncome;

      const buildJudgment = (type, name, ratioPercent, hasObligationRule, obligationStatus) => {
        const criterionAmount = getBenefitCriterionAmount(type, inputs.householdSize, criteriaConfig);
        const isIncomeEligible = recognizedIncome <= criterionAmount;
        const marginAmount = criterionAmount - recognizedIncome;
        let isObligationEligible = true;
        if (hasObligationRule && obligationStatus === 'not_met') isObligationEligible = false;
        const isEligible = isIncomeEligible && isObligationEligible;

        let estimatedBenefitText = '';
        if (type === 'livelihood') {
          const gap = Math.max(0, criterionAmount - recognizedIncome);
          estimatedBenefitText = isEligible
            ? '월 예상 생계급여 약 ' + formatNum(gap) + '원 지급 (선정기준액 - 소득인정액 차액)'
            : '소득인정액 초과 또는 부양의무자 기준 미충족으로 미선정';
        } else if (type === 'medical') {
          estimatedBenefitText = isEligible
            ? '1종 또는 2종 의료급여 수급 (외래·입원 본인부담금 대폭 경감)'
            : '소득인정액 초과 또는 부양의무자 기준 미충족으로 미선정';
        } else if (type === 'housing') {
          estimatedBenefitText = isEligible
            ? '임차가구 기준임대료 한도 내 월세 지원 / 자가가구 수선유지급여 지원 (부양의무자 폐지)'
            : '기준 중위소득 48% 초과로 미선정';
        } else {
          estimatedBenefitText = isEligible
            ? '초·중·고 교육활동지원비(연 1회) 및 고교 교과서·입학금·수업료 전액 지원 (부양의무자 폐지)'
            : '기준 중위소득 50% 초과로 미선정';
        }

        let statusReason = '선정 가능';
        if (!isIncomeEligible) statusReason = '기준액 ' + formatNum(Math.abs(marginAmount)) + '원 초과';
        else if (!isObligationEligible) statusReason = '부양의무자 기준 미충족';
        else if (hasObligationRule && obligationStatus === 'weak') statusReason = '선정 가능 (부양비 일부 부과 가능)';

        return { type, name, ratioPercent, criterionAmount, isIncomeEligible, isObligationEligible, isEligible, estimatedBenefitText, marginAmount, statusReason };
      };

      const livelihood = buildJudgment('livelihood', '생계급여', 32, true, inputs.supportObligation.livelihoodStatus);
      const medical = buildJudgment('medical', '의료급여', 40, true, inputs.supportObligation.medicalStatus);
      const housing = buildJudgment('housing', '주거급여', 48, false, 'exempt');
      const education = buildJudgment('education', '교육급여', 50, false, 'exempt');

      const nearPovertyResult = calculateNearPoverty(inputs, memberBreakdowns, propertyBreakdown, livelihood.isEligible, medical.isEligible);

      return {
        medianIncome, memberBreakdowns, totalEarnedAndBusinessIncome, totalPropertyIncome,
        totalTransferIncome, totalExpenditureDeduction, incomeEvaluation, propertyBreakdown,
        recognizedIncome, benefits: [livelihood, medical, housing, education], nearPovertyResult,
      };
    }
    // =========================================================================
    // 5. 애플리케이션 상태 관리 및 공통 컴포넌트 빌더
    // =========================================================================

    function getByPath(obj, path) {
      return path.split('.').reduce((acc, k) => (acc && acc[k] !== undefined ? acc[k] : undefined), obj);

      const keys = path.split('.');
      let cur = obj;
      for (let i = 0; i < keys.length - 1; i++) {
        cur = cur[keys[i]];
      }
      cur[keys[keys.length - 1]] = val;
    }

      appState.result = calculateWelfare(appState.inputs, appState.criteriaConfig);

      renderBasicSection();
      renderIncomeSection();
      renderPropertySection();
      renderObligationSection();
      renderNearPovertySection();
      renderResultsSection();
      renderCriteriaModal();
      renderExplainerModal();
      renderPrintableReport();

      if (activeId) {
        const restored = document.getElementById(activeId);
        if (restored) {
          restored.focus();
          if (selStart !== null && typeof restored.setSelectionRange === 'function') {
            const len = restored.value.length;
            restored.setSelectionRange(Math.min(selStart, len), Math.min(selEnd, len));
          }
        }
      }
    }

    window.appActions = {
      setFontScale(scale) {
        appState.fontScale = scale;
        document.documentElement.classList.remove('font-scale-normal', 'font-scale-large', 'font-scale-xlarge');
        document.documentElement.classList.add('font-scale-' + scale);
        document.querySelectorAll('.font-btn').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-font') === scale);
        });
      },

      setPathValue(path, val) {
        setByPath(appState.inputs, path, val);
        renderAll();
      },

      addPathAmount(path, delta) {
        const cur = Number(getByPath(appState.inputs, path)) || 0;
        setByPath(appState.inputs, path, Math.max(0, cur + delta));
        renderAll();
      },

      onCurrencyInput(inputEl, path) {
        const raw = inputEl.value.replace(/[^0-9]/g, '');
        const num = raw === '' ? 0 : Math.min(parseInt(raw, 10), 999999999999);
        setByPath(appState.inputs, path, num);
        renderAll();
      },

      setHouseholdSize(size) {
        const s = Math.min(20, Math.max(1, Number(size) || 1));
        appState.inputs.householdSize = s;
        renderAll();
      },

      addMember() {
        const idx = appState.inputs.incomeMembers.length + 1;
        appState.inputs.incomeMembers.push({
          id: 'member-' + Date.now() + '-' + idx,
          name: '가구원 ' + idx,
          category: 'general',
          age: 35,
          earnedIncome: 0,
          businessIncome: 0,
        });
        renderAll();
      },

      removeMember(id) {
        if (appState.inputs.incomeMembers.length <= 1) return;
        appState.inputs.incomeMembers = appState.inputs.incomeMembers.filter(m => m.id !== id);
        renderAll();
      },

      updateMember(id, field, val) {
        const m = appState.inputs.incomeMembers.find(item => item.id === id);
        if (m) {
          m[field] = val;
          renderAll();
        }
      },

      addCar() {
        const idx = appState.inputs.cars.length + 1;
        appState.inputs.cars.push({
          id: 'car-' + Date.now() + '-' + idx,
          name: '차량 ' + idx,
          value: 0,
          conversionType: 'general',
        });
        renderAll();
      },

      removeCar(id) {
        appState.inputs.cars = appState.inputs.cars.filter(c => c.id !== id);
        renderAll();
      },

      updateCar(id, field, val) {
        const c = appState.inputs.cars.find(item => item.id === id);
        if (c) {
          c[field] = val;
          renderAll();
        }
      },

      setNearPovertyCategory(hasQualified, catId) {
        appState.inputs.nearPoverty.hasQualifiedMember = hasQualified;
        if (catId) appState.inputs.nearPoverty.qualifiedCategory = catId;
        renderAll();
      },

      toggleDiseaseList() {
        appState.showDiseaseModalList = !appState.showDiseaseModalList;
        renderNearPovertySection();
      },

      toggleObligationTable() {
        appState.showObligationTable = !appState.showObligationTable;
        renderNearPovertySection();
      },

      setExplainerTab(tab) {
        appState.explainerTab = tab;
        renderResultsSection();
        renderExplainerModal();
      },

      openExplainer(tabNum) {
        if (tabNum === 1) appState.explainerTab = 'compare';
        else if (tabNum === 2) appState.explainerTab = 'income';
        else if (tabNum === 3) appState.explainerTab = 'property';
        document.getElementById('explainer-modal').classList.add('open');
        renderExplainerModal();
      },

      closeExplainer() {
        const modal = document.getElementById('explainer-modal');
        modal.classList.remove('open');
        modal.innerHTML = '';
      },

      openCriteriaModal() {
        appState.criteriaDraft = JSON.parse(JSON.stringify(appState.criteriaConfig));
        renderCriteriaModal();
      },

      closeCriteriaModal() {
        appState.criteriaDraft = null;
        renderCriteriaModal();
      },

      toggleCriteriaAutoSync(checked) {
        appState.criteriaAutoSync = checked;
      },

      updateCriteriaMedian(size, rawVal) {
        const num = parseInt(String(rawVal).replace(/[^0-9]/g, ''), 10) || 0;
        const d = appState.criteriaDraft;
        d.medianIncome[size] = num;
        if (appState.criteriaAutoSync) {
          d.livelihood[size] = Math.round(num * BENEFIT_RATIOS.livelihood);
          d.medical[size] = Math.round(num * BENEFIT_RATIOS.medical);
          d.housing[size] = Math.round(num * BENEFIT_RATIOS.housing);
          d.education[size] = Math.round(num * BENEFIT_RATIOS.education);
        }
        renderCriteriaModal();
      },

      updateCriteriaBenefit(type, size, rawVal) {
        const num = parseInt(String(rawVal).replace(/[^0-9]/g, ''), 10) || 0;
        appState.criteriaDraft[type][size] = num;
        renderCriteriaModal();
      },

      recalcCriteriaFromMedian() {
        const d = appState.criteriaDraft;
        for (let s = 1; s <= 7; s++) {
          const med = d.medianIncome[s] || 0;
          d.livelihood[s] = Math.round(med * BENEFIT_RATIOS.livelihood);
          d.medical[s] = Math.round(med * BENEFIT_RATIOS.medical);
          d.housing[s] = Math.round(med * BENEFIT_RATIOS.housing);
          d.education[s] = Math.round(med * BENEFIT_RATIOS.education);
        }
        renderCriteriaModal();
      },

      resetCriteriaDefault() {
        appState.criteriaDraft = createDefaultCriteriaConfig();
        renderCriteriaModal();
      },

      saveCriteriaModal() {
        if (appState.criteriaDraft) {
          appState.criteriaConfig = JSON.parse(JSON.stringify(appState.criteriaDraft));
          appState.criteriaDraft = null;
        }
        renderAll();
      },

      resetAll() {
        appState.inputs = createDefaultInputs();
        renderAll();
      },

      applyPreset(type) {
        const base = createDefaultInputs();
        if (type === 'youth_single') {
          base.householdSize = 1;
          base.region = 'seoul';
          base.incomeMembers = [{ id: 'm1', name: '신청인 (청년 26세)', category: 'youth', age: 26, earnedIncome: 1300000, businessIncome: 0 }];
          base.residentialProperty.jeonseDepositRatio95 = 28500000;
          base.financialProperty.savingsAndDeposits = 4500000;
        } else if (type === 'senior_couple') {
          base.householdSize = 2;
          base.region = 'gyeonggi';
          base.isSpecialHousehold = true;
          base.incomeMembers = [{ id: 'm1', name: '신청인 (78세 어르신)', category: 'elderly_75', age: 78, earnedIncome: 450000, businessIncome: 0 }];
          base.transferIncome.basicPension = 540000;
          base.expenditureDeduction.medicalExpense = 120000;
          base.residentialProperty.ownedHouseValue = 110000000;
          base.financialProperty.savingsAndDeposits = 12000000;
        } else if (type === 'special_disabled') {
          base.householdSize = 1;
          base.region = 'metro';
          base.isSpecialHousehold = true;
          base.incomeMembers = [{ id: 'm1', name: '신청인 (중증장애인)', category: 'disabled', age: 45, earnedIncome: 600000, businessIncome: 0 }];
          base.residentialProperty.jeonseDepositRatio95 = 85000000;
          base.financialProperty.savingsAndDeposits = 8000000;
          base.cars = [{ id: 'c1', name: '장애인사용자동차', value: 12000000, conversionType: 'exempt' }];
        } else if (type === 'family_four') {
          base.householdSize = 4;
          base.region = 'other';
          base.incomeMembers = [
            { id: 'm1', name: '가구주 (42세)', category: 'general', age: 42, earnedIncome: 2200000, businessIncome: 0 },
            { id: 'm2', name: '배우자 (40세)', category: 'general', age: 40, earnedIncome: 800000, businessIncome: 0 },
          ];
          base.residentialProperty.ownedHouseValue = 95000000;
          base.financialProperty.savingsAndDeposits = 15000000;
          base.debt.housingMortgage = 45000000;
          base.cars = [{ id: 'c1', name: '생업용 승합차', value: 9000000, conversionType: 'general' }];
        } else if (type === 'near_poverty_linkage') {
          base.householdSize = 1;
          base.region = 'gyeonggi';
          base.isSpecialHousehold = false;
          base.incomeMembers = [{ id: 'm1', name: '신청인 (62세·만성질환)', category: 'general', age: 62, earnedIncome: 950000, businessIncome: 0 }];
          base.transferIncome.privateTransfer = 250000;
          base.generalProperty.landValue = 110000000;
          base.financialProperty.savingsAndDeposits = 8000000;
          base.nearPoverty = {
            ...base.nearPoverty,
            hasQualifiedMember: true,
            qualifiedCategory: 'chronic_6m',
            obligationCheckMode: 'detailed',
            targetHouseholdQualifiedCount: 1,
            obligorFamilyCount: 3,
            obligorSevereDisabledCount: 0,
            obligorMonthlyIncome: 5800000,
            obligorConvertedPropertyIncome: 300000,
            obligorMedicalExpense: 150000,
            obligorEducationType: 'high',
            obligorEducationActual: 250000,
            obligorRentGrade: 'grade2',
            obligorRentActual: 400000,
            obligorHasHighAssetSkip: false,
          };
        }
        appState.inputs = base;
        renderAll();
      },

      downloadSingleHtml() {
        const docClone = document.documentElement.cloneNode(true);
        ['section-basic','section-income','section-property','section-obligation','section-nearpoverty','section-results','printable-report','criteria-modal','explainer-modal'].forEach(id => {
          const el = docClone.querySelector('#' + id);
          if (el) {
            el.innerHTML = '';
            el.classList.remove('open');
          }
        });
        const htmlContent = '<!doctype html>\n' + docClone.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      },
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderAll();
    });
  </script>
</body>
</html>
